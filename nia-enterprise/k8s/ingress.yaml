apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nia-ingress
  namespace: nia-enterprise
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/websocket-services: "nia-relay-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
  - hosts:
    - relay.nia-enterprise.io
    - grafana.nia-enterprise.io
    secretName: nia-tls-secret
  rules:
  - host: relay.nia-enterprise.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nia-relay-service
            port:
              number: 4040
  - host: grafana.nia-enterprise.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
