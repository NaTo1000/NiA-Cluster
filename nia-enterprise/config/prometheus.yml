global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'nia-enterprise'
    environment: 'production'

scrape_configs:
  - job_name: 'nia-relay'
    static_configs:
      - targets: 
        - 'relay-primary:9090'
        - 'relay-secondary:9090'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: relay_name
        replacement: '$1'

  - job_name: 'nia-nodes'
    dns_sd_configs:
      - names:
        - 'nia-node.nia-enterprise.svc.cluster.local'
        type: 'A'
        port: 9090

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

alerting:
  alertmanagers:
    - static_configs:
      - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/alerts/*.yml'
