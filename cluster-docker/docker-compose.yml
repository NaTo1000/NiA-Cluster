services:
  cluster-gui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nia-cluster-gui
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - CLUSTER_MODE=docker
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - cluster-network
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun

networks:
  cluster-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
