apiVersion: apps/v1
kind: Deployment
metadata:
  name: nia-node
  namespace: nia-enterprise
  labels:
    app: nia-node
    component: node
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nia-node
      component: node
  template:
    metadata:
      labels:
        app: nia-node
        component: node
    spec:
      containers:
      - name: node
        image: nia-enterprise:latest
        imagePullPolicy: IfNotPresent
        args:
          - --mode
          - node
          - --cluster
          - production
          - --node
          - $(POD_NAME)
          - --relay-host
          - nia-relay-service
          - --relay-port
          - "4040"
          - --lan-port
          - "5001"
          - --enable-ble
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: nia-config
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nia-node-hpa
  namespace: nia-enterprise
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nia-node
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
