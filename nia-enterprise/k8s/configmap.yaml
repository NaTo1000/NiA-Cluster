apiVersion: v1
kind: ConfigMap
metadata:
  name: nia-config
  namespace: nia-enterprise
data:
  relay.yaml: |
    cluster: production
    port: 4040
    ha_enabled: true
    tls_enabled: false
    metrics_enabled: true
    log_level: info
    
  node.yaml: |
    cluster: production
    ble_enabled: false
    heartbeat_interval: 10
    reconnect_delay: 5
