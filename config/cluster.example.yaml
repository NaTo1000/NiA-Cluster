# Example cluster configuration for NiA-Cluster
# Copy this file to cluster.yaml and customize for your environment

cluster:
  name: "myfleet"
  relay_port: 4040
  nodes:
    - name: "node1"
      lan_port: 5001
      enable_ble: true
    - name: "node2"
      lan_port: 5002
      enable_ble: false

security:
  enable_ssl: false
  # WARNING: Do not commit real passwords to version control
  password: "YourPassword"
  
features:
  enable_ble: false
  auto_discovery: true
