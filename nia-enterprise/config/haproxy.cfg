global
    log 127.0.0.1 local0
    log 127.0.0.1 local1 notice
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000
    timeout client 50000
    timeout server 50000

frontend nia_relay_frontend
    bind *:4000
    mode tcp
    option tcplog
    default_backend nia_relay_backend

backend nia_relay_backend
    mode tcp
    balance roundrobin
    option tcp-check
    server relay1 relay-primary:4040 check
    server relay2 relay-secondary:4040 check

frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE
