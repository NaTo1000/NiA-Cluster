apiVersion: v1
kind: Service
metadata:
  name: nia-relay-service
  namespace: nia-enterprise
  labels:
    app: nia-relay
    component: relay
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: LoadBalancer
  selector:
    app: nia-relay
    component: relay
  ports:
  - name: relay
    port: 4040
    targetPort: 4040
    protocol: TCP
  - name: health
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: Service
metadata:
  name: nia-relay-headless
  namespace: nia-enterprise
  labels:
    app: nia-relay
    component: relay
spec:
  clusterIP: None
  selector:
    app: nia-relay
    component: relay
  ports:
  - name: relay
    port: 4040
    targetPort: 4040
    protocol: TCP
